name: Release

# Task 18.1/18.2. Triggered on every version tag (vX.Y.Z). Builds and pushes
# the container image to GHCR using the repo's own GITHUB_TOKEN (no external
# registry credential needed — see docs/version-compatibility.md), then
# verifies the CI template and install script are reachable at their stable
# raw.githubusercontent.com URLs for this tag.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Verify VERSION file matches the tag
        run: |
          FILE_VERSION="$(cat VERSION)"
          if [ "$FILE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION file ($FILE_VERSION)" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/jornr94/docwelder:${{ steps.version.outputs.version }}
            ghcr.io/jornr94/docwelder:latest
          build-args: |
            DOCWELDER_VERSION=${{ steps.version.outputs.version }}

  smoke-test-published-artifacts:
    needs: build-and-push-image
    runs-on: ubuntu-latest
    steps:
      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # The CI template and install script need no separate "publish" step —
      # tagging the repo IS what makes raw.githubusercontent.com/.../vX.Y.Z/...
      # resolvable. This job just confirms that held true for this release.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fetch and parse the just-tagged CI template
        run: |
          URL="https://raw.githubusercontent.com/JornR94/DocWelder/v${{ steps.version.outputs.version }}/release/ci-template.yml"
          curl -fsSL "$URL" -o /tmp/ci-template.yml
          node -e "
            const fs = require('fs');
            const yaml = require('yaml');
            const doc = yaml.parse(fs.readFileSync('/tmp/ci-template.yml', 'utf8'));
            for (const job of ['docwelder-propose', 'docwelder-publish']) {
              if (!doc[job]) throw new Error('missing job: ' + job);
            }
            console.log('CI template parsed OK:', Object.keys(doc));
          "
      - name: Confirm the install script is reachable at its stable URL
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/JornR94/DocWelder/main/release/install.sh' -o install.sh
          sh -n install.sh || bash -n install.sh
          echo "install.sh fetched and syntax-checked OK."
